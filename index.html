<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Привычек</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .habits-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .habit-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .habit-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .habit-item.completed {
            background: #d4edda;
        }

        .habit-info {
            flex: 1;
        }

        .habit-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .habit-stats {
            font-size: 14px;
            color: #666;
        }

        .habit-actions {
            display: flex;
            gap: 10px;
        }

        .btn-complete {
            padding: 8px 15px;
            background: #28a745;
            font-size: 14px;
        }

        .btn-delete {
            padding: 8px 15px;
            background: #dc3545;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .input-section {
                flex-direction: column;
            }

            .habit-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .habit-actions {
                width: 100%;
            }

            .habit-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Трекер Привычек</h1>
        <p class="subtitle">Следи за своими привычками каждый день</p>

        <div class="input-section">
            <input type="text" id="habitInput" placeholder="Введи новую привычку..." maxlength="50">
            <button onclick="addHabit()">Добавить</button>
        </div>

        <div class="habits-list" id="habitsList"></div>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [];

        function saveHabits() {
            localStorage.setItem('habits', JSON.stringify(habits));
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const name = input.value.trim();
            
            if (name === '') {
                alert('Введи название привычки!');
                return;
            }

            const habit = {
                id: Date.now(),
                name: name,
                completed: false,
                streak: 0,
                totalCompletions: 0,
                lastCompleted: null
            };

            habits.push(habit);
            saveHabits();
            input.value = '';
            renderHabits();
        }

        function toggleComplete(id) {
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            const today = new Date().toDateString();
            
            if (!habit.completed) {
                habit.completed = true;
                habit.totalCompletions++;
                
                if (habit.lastCompleted !== today) {
                    habit.streak++;
                    habit.lastCompleted = today;
                }
            } else {
                habit.completed = false;
                habit.streak = Math.max(0, habit.streak - 1);
            }

            saveHabits();
            renderHabits();
        }

        function deleteHabit(id) {
            if (confirm('Удалить эту привычку?')) {
                habits = habits.filter(h => h.id !== id);
                saveHabits();
                renderHabits();
            }
        }

        function renderHabits() {
            const list = document.getElementById('habitsList');
            
            if (habits.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>Пока нет привычек. Добавь первую!</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = habits.map(habit => `
                <div class="habit-item ${habit.completed ? 'completed' : ''}">
                    <div class="habit-info">
                        <div class="habit-name">${habit.name}</div>
                        <div class="habit-stats">
                            🔥 Серия: ${habit.streak} дн. | ✅ Всего: ${habit.totalCompletions}
                        </div>
                    </div>
                    <div class="habit-actions">
                        <button class="btn-complete" onclick="toggleComplete(${habit.id})">
                            ${habit.completed ? '↩️ Отменить' : '✓ Выполнено'}
                        </button>
                        <button class="btn-delete" onclick="deleteHabit(${habit.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // Enter для добавления
        document.getElementById('habitInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addHabit();
        });

        // Инициализация
        renderHabits();
    </script>
</body>
</html>
